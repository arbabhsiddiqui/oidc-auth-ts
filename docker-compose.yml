services:
  oidc_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oidc_auth_ts
    ports:
      - "6000:6000"
    volumes:
      - .:/app
      # - pnpm-store:/pnpm/store
      # - /app/node_modules
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/oidc_auth_ts
    depends_on:
      - postgres
    networks:
      - app_network
    command: tail -f /dev/null

  postgres:
    image: postgres:17
    container_name: oidc_auth_ts_postgres_db
    restart: unless-stopped
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oidc_auth_ts
    volumes:
      - pgdataoidcauthts:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdataoidcauthts:
  # pnpm-store: